description: >-
  The F-15EX Eagle II is the latest development of the F-15E Strike Eagle,
  bought by the USAF to replace its ageing F-15C/D fleet. It pairs the AN/APG-82
  AESA radar and a fly-by-wire, all-glass cockpit with more powerful engines, and
  its outer wing stations and AMBER racks let it carry up to 22 AMRAAMs.<br /><br />

  This entry is Spino's F-15EX mod (V3) with conformal fuel tanks: about 4,400 kg
  more internal fuel, and CFT and AMBER stations for AMRAAM, AIM-260A, AIM-200A and
  AIM-174B. V3 carries air-to-air stores only.
  It is not listed in factions on its own: F-15EX flights switch to it with the
  "Fit conformal fuel tanks" option in their payload settings.
