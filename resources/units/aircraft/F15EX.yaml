description: >-
  The F-15EX Eagle II is the latest development of the F-15E Strike Eagle,
  bought by the USAF to replace its ageing F-15C/D fleet. It pairs the AN/APG-82
  AESA radar and a fly-by-wire, all-glass cockpit with more powerful engines, and
  its outer wing stations and AMBER shoulder rails let it carry up to 22 AMRAAMs.<br /><br />

  This entry is Spino's F-15EX mod. Without conformal fuel tanks it carries
  AMRAAM tandem rails on the fuselage stations, JASSM-ER, LRASM and SLAM-ER on the
  inboard wing pylons, and AIM-200, AIM-260, MAKO and AARGM-ER on the new outer
  stations. Tick "Fit conformal fuel tanks" in a flight's payload settings to fly
  it with CFTs instead: about 4,400 kg more fuel and conformal stations for AMRAAM
  and AIM-200 racks and six-bomb rows, but no JASSM-ER, LRASM or SLAM-ER.
