description: >-
  The F-15EX Eagle II is the latest development of the F-15E Strike Eagle,
  bought by the USAF to replace its ageing F-15C/D fleet. It pairs the AN/APG-82
  AESA radar and a fly-by-wire, all-glass cockpit with more powerful engines, and
  its outer wing stations and AMBER racks let it carry up to 22 AMRAAMs.<br /><br />

  This entry is Spino's F-15EX mod (V3, with its own flight model and avionics).
  Without conformal fuel tanks it carries single AMRAAM, AIM-260A or AIM-200A
  rounds on the fuselage stations, twin rails on the outer wing stations and
  LAU-115s or the AIM-174B on the wing pylons. Tick "Fit conformal fuel tanks" in a
  flight's payload settings to fly it with CFTs instead: about 4,400 kg more fuel
  and CFT and AMBER stations for more missiles. V3 carries air-to-air stores only.
