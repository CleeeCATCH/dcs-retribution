description: >-
  The F-15IA is Israel's variant of the F-15EX, ordered in 2024 to serve
  alongside the F-15I Ra'am. It shares the EX's AN/APG-82 AESA radar, fly-by-wire
  controls and glass cockpit.<br /><br />

  This entry is the F-15IA from Spino's F-15EX mod (V3): the conformal fuel tank
  airframe, with Python-5 as well as AIM-9X on the wing rails, and CFT and AMBER
  stations for AMRAAM, AIM-260A, AIM-200A and AIM-174B. V3 carries air-to-air
  stores only.
